<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GV309 Week 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="groupbar" class="groupbar" hidden></div>
<div class="wrap" id="wrap">
  <header class="masthead"><h1 id="title">GV309 Week 9</h1><p id="subtitle"></p></header>
  <nav id="qnav" aria-label="Questions" hidden></nav>
  <div id="banner" hidden></div>
  <div id="error" class="error" hidden role="alert"></div>
  <main id="main"><p class="hint">Loading…</p></main>
</div>
<aside id="askpanel" class="askpanel" role="dialog" aria-labelledby="asktitle" hidden>
  <div class="askhead"><h2 id="asktitle">Ask your instructor</h2><button type="button" class="btn quiet small" id="askclose">Close</button></div>
  <div class="askbody">
    <label class="field"><span>About</span><select id="askabout"></select></label>
    <label class="field"><span>Your question</span><textarea id="asktext" maxlength="1000" rows="4"></textarea></label>
    <p class="hint">Choose whether your instructor sees your group’s name. Everyone in your group sees the question and the answer either way.</p>
    <div class="row"><button class="btn" type="button" id="asknamed">Send with our group’s name</button><button class="btn quiet" type="button" id="askanon">Send anonymously</button></div>
    <p class="askstatus" id="askstatus" aria-live="polite"></p>
    <div id="asklist"></div>
  </div>
</aside>
<div id="toast" class="floattoast" role="status" aria-live="polite" hidden></div>
<script src="/vendor/yjs.js"></script>
<script src="/collab.js"></script>
<script src="/student.js"></script>
</body>
</html>
